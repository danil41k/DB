{% extends 'base.html' %}

{% block title %}
Додавання учасника
{% endblock %}

{% block content %}

<h2>Додавання нового учасника</h2>

<form method="POST">

    <label>
        Ім'я
    </label>

    <input
        type="text"
        name="first_name"
        required
    >

    <label>
        Прізвище
    </label>

    <input
        type="text"
        name="last_name"
        required
    >

    <label>
        Дата народження
    </label>

    <input
        type="date"
        name="birth_date"
        required
    >

    <label>
        Телефон
    </label>

    <input
        type="text"
        name="phone"
        required
    >

    <label>
        Email
    </label>

    <input
        type="email"
        name="email"
        required
    >

    <button type="submit">
        Додати
    </button>

</form>

{% endblock %}
